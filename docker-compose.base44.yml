services:
  app:
    image: node:22-slim
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
      - /app/data
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOST=0.0.0.0
      # Vite >= 6.1 appends this to allowedHosts so the preview origin can reach HMR/dev assets
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    env_file:
      - /run/base44/app.env
    command:
      - sh
      - -ec
      - |
        npm install -g bun --silent
        bun install --frozen-lockfile
        exec ./node_modules/.bin/tsx server.ts
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 45s
    restart: on-failure
