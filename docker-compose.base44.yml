services:
  app:
    # Bun runtime (matches bun.lock); the repo is bind-mounted so edits are live.
    image: oven/bun:1
    working_dir: /app
    command:
      - sh
      - -ec
      - bun install --frozen-lockfile && exec bun run dev
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - CI=true
      - BASE44_PREVIEW_MODE
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS=${__VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS:-}
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    env_file:
      # Platform-managed secrets (e.g. GEMINI_API_KEY); optional so the stack
      # still boots before any secret is configured.
      - path: /run/base44/app.env
        required: false
    restart: on-failure
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
